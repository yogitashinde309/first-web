<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div style="text-align: center;">

        <h1>Cat Project</h1>


        <button onclick="start()">Start</button>
        

        <img id="cat" src="aseets/img1.png" alt="">


        <button onclick="stop()">Stop</button>

    </div>

    <script>

        function start() {
            document.getElementById("cat").src = "aseets/img2.gif";
        };


        function stop() {
            document.getElementById("cat").src = "aseets/img1.png";
        };

    </script>


</body>

</html>
